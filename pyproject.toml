[project]
name = "yolo-training"
version = "0.1.7"
description = "A custom training script for training YOLO models on Viam datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnx>=1.17.0",
    "onnxruntime>=1.21.0",
    "onnxruntime-gpu ; sys_platform == 'linux'",
    "onnxslim>=0.1.49",
    # opencv-python 4.13+ (and 5.x) link libxcb, which the Viam training image lacks.
    # ultralytics needs >=4.7, so 4.12 is the newest wheel that imports there.
    "opencv-python>=4.7,<4.13",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "ultralytics>=8.3.104",
]

[tool.setuptools]
packages=["model"]
